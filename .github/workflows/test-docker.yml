name: Test Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

jobs:
  test-docker:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-name: '25'
            docker-version: 'v25.0.5'
            os: ubuntu-latest
          - docker-name: '26'
            docker-version: 'v26.1.4'
            os: ubuntu-latest
          - docker-name: '27'
            docker-version: 'v27.4.1'
            os: ubuntu-latest
          - docker-name: '27, arm64'
            docker-version: 'v27.4.1'
            os: ubuntu-24.04-arm

    name: test-docker (${{ matrix.docker-name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          version: ${{ matrix.docker-version }}

      - name: Check coding standards
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      - name: Build Docker image
        run: docker build -t "drevops/shellvar:test" .

      - name: Run tests
        run: docker run -v "$(pwd)":/app drevops/shellvar:test lint tests/phpunit/Fixtures/unwrapped.sh | grep -q "Found 3 variables"

  push-canary-to-registry:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    needs:
      - test-docker

    concurrency:
      group: ${{ github.workflow }}-canary
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ vars.DOCKER_IMAGE || 'drevops/shellvar' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKER_IMAGE || 'drevops/shellvar' }}:canary
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
