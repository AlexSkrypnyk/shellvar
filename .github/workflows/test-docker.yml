name: Test Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'

jobs:
  test-docker:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - docker-name: '25'
            docker-version: 'v25.0.5'
          - docker-name: '26'
            docker-version: 'v26.1.4'
          - docker-name: '27'
            docker-version: 'v27.4.1'

    name: test-docker (${{ matrix.docker-name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: ${{ matrix.docker-version }}

      - name: Check coding standards
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0

      - name: Build Docker image
        run: docker build -t "drevops/shellvar:test" .

      - name: Run tests
        run: docker run -v $(pwd):/app drevops/shellvar:test lint tests/phpunit/Fixtures/unwrapped.sh | grep -q "Found 3 variables"
